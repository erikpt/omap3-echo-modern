name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y e2fsprogs shellcheck
      - name: Shellcheck
        run: shellcheck scripts/*.sh
      - name: Unit tests
        run: python3 -m unittest discover -s tests -t . -v
